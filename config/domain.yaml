# =============================================================================
# CryoNav — Domain Configuration
# Every script reads this file. No magic numbers anywhere else in the codebase.
# =============================================================================

region:
  name: "Southern Ocean Domain (60°S–78°S, Full Longitude)"
  lon_min: -180.0   # degrees East (-180 to 180 or 0 to 360)
  lon_max: 180.0
  lat_min: -78.0    # degrees North (negative = South)
  lat_max: -60.0

projection:
  name: "Antarctic Polar Stereographic"
  epsg: 3031
  central_meridian: 0.0
  standard_parallel: -71.0
  resolution_m: 25000.0  # 25 km grid spacing
  extent_m: [-3350000.0, 3350000.0, -3350000.0, 3350000.0]  # [x_min, x_max, y_min, y_max]
  grid_shape: [269, 269]

time:
  step: "daily"
  start_date: "2017-01-01"
  end_date: "2024-12-31"
  forecast_horizon_days: 14
  input_window_days: 7

splits:
  train: ["2017-01-01", "2022-12-31"]
  val: ["2023-01-01", "2023-12-31"]
  test: ["2024-01-01", "2024-12-31"]

held_out_demo_dates:
  - "2021-02-10"
  - "2023-01-20"
  - "2024-02-15"

season:
  demo_months: [11, 12, 1, 2, 3]  # Nov–Mar austral summer

